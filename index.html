<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #fff; }

  45%  { transform: scale(1.08,.9) rotate(1.5deg); }
  55%  { transform: scale(.95,1.1) rotate(-2deg); }
  65%  { transform: scale(1.1,.88) rotate(2.5deg); }
  75%  { transform: scale(.94,1.12) rotate(-3deg); }
  85%  { transform: scale(1.12,.86) rotate(3deg); }

}

  from { transform: scale(1.14,.8); }

}

  #gift { opacity: 0; }

    background: #fff; border: 3px solid #000; border-radius: 18px; box-shadow: 6px 6px 0 #000; box-sizing: border-box; padding: 14px;

  .ic-grid button:active { transform: scale(.92); background: #000; color: #fff; }
  .ic-paper{position:absolute;z-index:29;background:#fff;border:3px solid #000;border-radius:4px;box-sizing:border-box;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent;transform-origin:0 0;opacity:0;transition:opacity .4s;box-shadow:3px 3px 0 #000}

  .ic-sheet.in{opacity:1}

  .ic-sheet.in .ic-sheet-p{transform:rotate(-2deg) scale(1)}

<body>
  <div id="world">
    <svg class="gift" id="gift" viewBox="0 0 64 64" width="64" height="64" role="button" aria-label="Plic">
      <rect x="6" y="16" width="52" height="36" rx="3" fill="#000"/>
      <path d="M10 21 L32 39 L54 21" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M11 48 L25 34 M53 48 L39 34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <p id="txt"></p>
  </div>
  <p id="hint"></p>
<script>
// ===== ÎNGHEȚARE TOTALĂ când ieși din browser =====
(() => {
  let paused = false, pausedAt = 0, offset = 0, uid = 0;
  const realNow = performance.now.bind(performance);
  const vnow = () => (paused ? pausedAt : realNow()) - offset;
  performance.now = vnow;                       // ceas virtual, fără timpul cât a stat în pauză

  const rRAF = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = cb => rRAF(() => cb(vnow()));

  const rST = window.setTimeout.bind(window), rCT = window.clearTimeout.bind(window);
  const timers = new Map();
  const arm = t => {
    t.start = realNow();
    t.h = rST(() => {
      if (t.every != null) { t.left = t.every; arm(t); } else timers.delete(t.id);
      t.fn(...t.args);
    }, t.left);
  };
  const add = (fn, ms, args, every) => {
    const t = { id: ++uid, fn, args, left: Math.max(0, +ms || 0), every };
    timers.set(t.id, t);
    if (!paused) arm(t);
    return t.id;
  };
  const del = id => { const t = timers.get(id); if (t) { rCT(t.h); timers.delete(id); } };
  window.setTimeout = (fn, ms, ...a) => add(fn, ms, a, null);
  window.setInterval = (fn, ms, ...a) => add(fn, ms, a, Math.max(1, +ms || 0));
  window.clearTimeout = del;
  window.clearInterval = del;

  const frozen = [];
  const pause = () => {
    if (paused) return;
    const n = realNow();
    timers.forEach(t => { rCT(t.h); t.left = Math.max(0, t.left - (n - t.start)); });
    paused = true; pausedAt = n;
    document.getAnimations().forEach(a => { if (a.playState === 'running') { a.pause(); frozen.push(a); } });
  };
  const resume = () => {
    if (!paused) return;
    offset += realNow() - pausedAt; paused = false;
    timers.forEach(arm);
    frozen.splice(0).forEach(a => { try { a.play(); } catch (_) {} });
  };

  document.addEventListener('visibilitychange', () => document.hidden ? pause() : resume());
  addEventListener('pagehide', pause);
  addEventListener('pageshow', resume);
  addEventListener('blur', pause);
  addEventListener('focus', resume);
})();
  const t = document.getElementById('txt');
  const wait = ms => new Promise(r => setTimeout(r, ms));
// fără muzică de fundal în intro (în modul cu butonul de nivele, muzica merge ca înainte)
window.noMusic = !(+location.hash.slice(1) && innerWidth > 700);

  /* ===== SUNETE (sintetizate, fara fisiere) ===== */
  const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (_) {} };
  const SFX = (() => {
    let ac, mg, nb, eng = null, lastBump = 0, foot = false;
    const waveBus = [];
    const init = () => {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); mg = ac.createGain(); mg.gain.value = .6; mg.connect(ac.destination);
    nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    ac.onstatechange = () => { if (ac.state === 'running') music.start(); };
  }
  if (ac.state === 'suspended') ac.resume().then(() => { if (ac.state === 'running') music.start(); }).catch(() => {});
  else if (ac.state === 'running') music.start();
};
    // oprește sunetul când ieși din browser sau blochezi telefonul
    const pauseAudio = () => { if (ac && ac.state === 'running') ac.suspend().catch(() => {}); };
    const resumeAudio = () => { if (ac && ac.state === 'suspended') ac.resume().catch(() => {}); };
    document.addEventListener('visibilitychange', () => document.hidden ? pauseAudio() : resumeAudio());
    addEventListener('pagehide', pauseAudio);
    addEventListener('pageshow', resumeAudio);
    addEventListener('blur', pauseAudio);
    addEventListener('focus', resumeAudio);
    const env = (g, t0, d, v, a, rise) => {
      g.gain.setValueAtTime(.0001, t0);
      if (rise) { g.gain.exponentialRampToValueAtTime(v, t0 + d * .95); g.gain.linearRampToValueAtTime(.0001, t0 + d); }
      else { g.gain.linearRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); }
    };
const tone = (f, d, o = {}) => {
  if (!ac) return;
  const { type = 'sine', v = .25, at = 0, to = f, a = .008, rise = false, dest = null } = o, t0 = ac.currentTime + at;
  const os = ac.createOscillator(), g = ac.createGain();
  os.type = type; os.frequency.setValueAtTime(f, t0); os.frequency.exponentialRampToValueAtTime(Math.max(1, to), t0 + d);
  env(g, t0, d, v, a, rise); os.connect(g); g.connect(dest || mg); os.start(t0); os.stop(t0 + d + .05);
};
const noise = (d, o = {}) => {
  if (!ac) return;
  const { v = .25, at = 0, f = 1000, to = f, q = 1, type = 'bandpass', a = .01, rise = false, dest = null } = o, t0 = ac.currentTime + at;
  const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = nb; s.loop = true; fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f, t0); fl.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + d);
  env(g, t0, d, v, a, rise); s.connect(fl); fl.connect(g); g.connect(dest || mg); s.start(t0); s.stop(t0 + d + .05);
};
    // ---- melodie de fundal: aventura usoara, in bucla (8 masuri, La minor) ----
    const music = (() => {
      let mus = null, timer = null, step = 0, next = 0, lvl = .6;
      let eighth = 60 / 108 / 2, mode = 'calm'; const mf = m => 440 * Math.pow(2, (m - 69) / 12);
      const CH = [
        { b: 45, a: [57, 60, 64, 69] }, { b: 41, a: [53, 57, 60, 65] }, { b: 48, a: [60, 64, 67, 72] }, { b: 43, a: [55, 59, 62, 67] },
        { b: 45, a: [57, 60, 64, 69] }, { b: 41, a: [53, 57, 60, 65] }, { b: 43, a: [55, 59, 62, 67] }, { b: 40, a: [52, 56, 59, 64] }
      ];
      const ARP = [0, 1, 2, 3, 2, 1, 2, 1], _ = null;
      const MEL = [
        [76, _, _, 72, 69, _, 72, _], [74, _, _, 69, 65, _, 69, _], [72, _, 76, _, 79, _, 76, _], [74, _, 71, _, 67, _, _, _],
        [76, _, _, 72, 69, _, 72, 76], [77, _, _, 74, 72, _, 69, _], [74, _, 71, _, 74, _, 79, _], [76, _, 71, _, 68, _, _, _]
      ];
      const DMEL = [
        [69, 72, 76, 72, 69, 72, 76, 81], [77, 74, 72, 74, 77, 74, 72, 69], [72, 76, 79, 76, 72, 76, 79, 84], [79, 74, 71, 74, 79, 74, 71, 67],
        [76, _, 76, 77, 76, 72, 69, 72], [74, _, 74, 77, 74, 72, 69, 65], [71, 74, 79, 74, 71, 74, 79, 83], [80, 76, 71, 76, 80, 76, 83, _]
      ];
      // melodia vesela (pentru bloc si scari): Do major, oom-pah, acorduri pe contratimp
      const HCH = [
        { b: 48, c: [60, 64, 67] }, { b: 43, c: [59, 62, 67] }, { b: 45, c: [57, 60, 64] }, { b: 41, c: [57, 60, 65] },
        { b: 48, c: [60, 64, 67] }, { b: 43, c: [59, 62, 67] }, { b: 41, c: [57, 60, 65] }, { b: 43, c: [59, 62, 67] }
      ];
      const HMEL = [
        [76, _, 79, 76, 72, _, 76, _], [74, _, 79, 74, 71, _, 74, _], [72, _, 76, 72, 69, _, 72, 76], [77, _, 72, _, 77, 79, 77, _],
        [76, _, 79, 76, 84, _, 79, 76], [74, 71, 74, 79, 74, _, 71, _], [72, _, 77, 72, 69, _, 72, 77], [71, 74, 79, _, 77, 74, 71, _]
      ];
      // melodie dulce, ca de cutie muzicala (Do major), pentru chenare
      const QCH = [
        { b: 48, c: [60, 64, 67] }, { b: 45, c: [57, 60, 64] }, { b: 41, c: [57, 60, 65] }, { b: 43, c: [55, 59, 62] },
        { b: 48, c: [60, 64, 67] }, { b: 45, c: [57, 60, 64] }, { b: 41, c: [57, 60, 65] }, { b: 43, c: [55, 59, 62] }
      ];
      const QMEL = [
        [79, _, 76, _, 72, _, 76, _], [76, _, 72, _, 69, _, 72, _], [77, _, 74, _, 72, _, 69, _], [74, _, 71, _, 67, _, 71, 74],
        [79, _, 84, _, 79, _, 76, _], [81, _, 76, _, 72, _, 76, _], [77, _, 81, _, 77, _, 74, _], [74, _, 71, _, 67, _, _, _]
      ];
      const sched = () => {
        while (next < ac.currentTime + .5) {
          const bar = Math.floor(step / 8) % 8, s = step % 8, at = Math.max(0, next - ac.currentTime), c = CH[bar];
          if (mode === 'drive') {
            // cursa: bas pe fiecare optime, bataie pe fiecare timp, hi-hat pe contratimp, lead de aventura
            const m = DMEL[bar][s];
            tone(mf(c.b), .14, { v: s % 2 ? .07 : .1, at, dest: mus, a: .005 });
            if (s % 2 === 0) tone(110, .12, { v: .16, at, dest: mus, to: 45 });
            else noise(.04, { v: .035, at, f: 7000, type: 'highpass', dest: mus });
            if (m) { tone(mf(m), .2, { v: .08, at, dest: mus, type: 'triangle', a: .004 }); tone(mf(m + 12), .12, { v: .02, at, dest: mus }); }
          } else if (mode === 'happy') {
            // vesel: bas oom-pah, acorduri scurte pe contratimp, melodie saltareata
            const h = HCH[bar], m = HMEL[bar][s];
            if (s === 0) { tone(mf(h.b), .3, { v: .14, at, dest: mus, a: .006 }); tone(mf(h.b + 12), .2, { v: .04, at, dest: mus }); }
            if (s === 4) tone(mf(h.b + 7), .25, { v: .1, at, dest: mus, a: .006 });

// 7 benzi verticale peste capacul cutiei (pornesc din gura corpului); dupa 2s rosul coboara foarte rapid peste tot
function stain(G) {
  const W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  const mk = z => {
    const cv = document.createElement('canvas');
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.cssText = `position:fixed;inset:0;width:100%;height:100%;z-index:${z};pointer-events:none`;
    document.body.appendChild(cv);
    return cv.getContext('2d');
  };
  const cb = mk(6);   // benzi: peste cutie si capac (cutia are z-index 7)
  const cr = mk(8);   // rosu: creat al doilea, deci e peste benzi (si peste cutie)

  const r0 = G.getBoundingClientRect();
  const bodyL = r0.left + r0.width * .22, bodyW = r0.width * .56;   // centrat, cu margine egala pe ambele laterale
  const oy = r0.top + r0.height * .42;                              // putin sub marginea de sus a corpului
  const LW = bodyW / 7;

  const RB = ['#ff1744', '#ff7a00', '#ffd000', '#2bd96b', '#1e90ff', '#5b3df5', '#b33dff'];
  const RED = '#e8112d';
  const bands = RB.map((col, i) => ({ col, x: bodyL + i * LW, h: 0 }));
  const SPEED = 2600;


  const cw = Math.max(26, W / 14);
  const drips = [];
  for (let x = -cw; x < W + cw * 2; x += cw * .8) {
    drips.push({
      x, w: cw * (1.7 + Math.random() * .5),
      delay: 1 + Math.random() * .1,
      v: 2600 + Math.random() * 600, a: 14000 + Math.random() * 4000,
      ph: Math.random() * 6.28, bulb: 1.08 + Math.random() * .2, y: -30
    });
  }
  setTimeout(() => SFX.waveRed(), 1000);
  const born = performance.now(); let last = born;
  const tick = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const age = (now - born) / 1000;

    // benzile cresc in sus, peste capac
    cb.setTransform(dpr, 0, 0, dpr, 0, 0);
    cb.clearRect(0, 0, W, H);
    for (const b of bands) {
      b.h += SPEED * dt;
      cb.fillStyle = b.col;
      cb.fillRect(b.x - .5, oy - b.h, LW + 1, b.h);
    }

    // rosul
    cr.setTransform(dpr, 0, 0, dpr, 0, 0);
    cr.clearRect(0, 0, W, H);
    let allDone = true;
    cr.fillStyle = RED; cr.strokeStyle = RED;
    for (const d of drips) {
      const t = Math.max(0, age - d.delay);
      if (t > 0) d.y = -30 + d.v * t + .5 * d.a * t * t;
      if (d.y < H + d.w) allDone = false;
      if (t <= 0) continue;
      const sway = Math.sin(age * 2 + d.ph) * 3;
      cr.lineWidth = d.w; cr.lineCap = 'butt';
      cr.beginPath(); cr.moveTo(d.x + sway, -40); cr.lineTo(d.x + sway, d.y); cr.stroke();
      cr.beginPath(); cr.arc(d.x + sway, d.y, d.w / 2 * d.bulb, 0, 7); cr.fill();
    }

    if (!allDone) requestAnimationFrame(tick);
    else { cr.fillStyle = RED; cr.fillRect(0, 0, W, H); finale(W, H, dpr); }
  };
  requestAnimationFrame(tick);
}

// confeti: la fiecare 3 secunde sar din laturile cercului, pe sub el (canvasul e sub cerc ca z-index)
function confetti(svg, s) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const cv = document.createElement('canvas');
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  // acelasi z-index ca #s (11), dar inaintea lui in DOM => sub cerc, camera si coroana
  cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:11;pointer-events:none';
  document.body.insertBefore(cv, s);
  const c = cv.getContext('2d');
  const COLS = ['#ff1744', '#ff7a00', '#ffd000', '#2bd96b', '#1e90ff', '#b33dff', '#ff5fa8', '#ffffff'];
  let parts = [];

  const burst = () => {
    const r = svg.getBoundingClientRect();
    if (!r.width || r.bottom < 0 || r.top > innerHeight) return;   // cercul nu se vede (ai dat scroll)
    const k = r.width / 400, cx = r.left + 200 * k, cy = r.top + 250 * k, R = 150 * k;
    for (const side of [-1, 1]) {
      for (let i = 0; i < 24; i++) {
        parts.push({
          x: cx + side * R * .85, y: cy + (Math.random() - .5) * R * 1.1,
          vx: side * (60 + Math.random() * 170), vy: -(450 + Math.random() * 550),
          rot: Math.random() * 6.28, vr: (Math.random() - .5) * 14,
          w: 6 + Math.random() * 7, h: 3 + Math.random() * 5,
          col: COLS[Math.floor(Math.random() * COLS.length)], age: 0, life: 2.2 + Math.random() * .8
        });
      }
    }
  };

  let last = performance.now();
  const tick = now => {
    if (!cv.isConnected) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.age < p.life);
    for (const p of parts) {
      p.age += dt;
      p.vy += 900 * dt; p.vx *= 1 - .6 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      c.globalAlpha = Math.min(1, (p.life - p.age) / .5);
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      c.fillStyle = p.col; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      c.restore();
    }
    c.globalAlpha = 1;
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  setTimeout(burst, 1200);                 // prima rafala, dupa ce cercul a aparut
  setInterval(() => { if (cv.isConnected) burst(); }, 2000);
}

  const STEP = 1700, START = 900;
  slots.forEach((sl, i) => T(() => {
    const ty = sl.cy, vy = Math.sqrt(2 * 520 * (boxY - ty)), tt = vy / 520;
    const cx = sl.x + sl.w / 2;
    launch(boxX, boxY, false, { ty, vx: (cx - boxX) / tt, kind: 'peony', col: WCOLS[i % WCOLS.length], word: sl });
  }, START + i * STEP));

  // final: textul se colorează în curcubeu, salvă mare, apoi artificii rare (fără cuvinte)
  T(() => {
    rainbow = true; flashA = .5; flashC = '#ff5fa8';
    try { SFX.boom(); } catch (_) {}
    for (let i = 0; i < 10; i++) T(() => fromBox(i % 3 === 0, { vx: rnd(-170, 170), ty: H * rnd(.52, .74) }), i * 230);
    T(() => {
      const spawn = setInterval(() => {
        if (!cv.isConnected) return clearInterval(spawn);
        fromBox(Math.random() < .3, { vx: rnd(-140, 140), ty: H * rnd(.5, .75) });
      }, 3000 / SPEED);
    }, 3500);
  }, START + slots.length * STEP + 1800);

  // ---- randare ----
  let last = performance.now();
  const tick = now => {
    if (!cv.isConnected) return;
    const dt = Math.min(.05, (now - last) / 1000) * SPEED; last = now;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.globalCompositeOperation = 'destination-out';
    c.fillStyle = 'rgba(0,0,0,.14)'; c.fillRect(0, 0, W, H);   // dâre mai lungi
    c.globalCompositeOperation = 'lighter';

    // sclipirea cerului la explozie
    if (flashA > .01) {
      const g = c.createRadialGradient(W / 2, H * .3, 0, W / 2, H * .3, Math.max(W, H) * .8);
      g.addColorStop(0, flashC); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.globalAlpha = flashA * .35; c.fillStyle = g; c.fillRect(0, 0, W, H); c.globalAlpha = 1;
      flashA *= Math.pow(.02, dt);
    }

    // rachete cu dâră de scântei
    rockets = rockets.filter(r => {
      r.vy += 520 * dt; r.x += r.vx * dt; r.y += r.vy * dt; r.t += dt;
      if (Math.random() < .9) add(r.x + rnd(-1.5, 1.5), r.y + 4, rnd(-15, 15), rnd(20, 70), '#ffcf6b', rnd(.3, .6), 1.3, { g: 60, drag: 1 });
      c.fillStyle = '#fff'; c.beginPath(); c.arc(r.x, r.y, 2.4, 0, 7); c.fill();
      c.globalAlpha = .6; c.fillStyle = r.col; c.beginPath(); c.arc(r.x, r.y, 5, 0, 7); c.fill(); c.globalAlpha = 1;
      if (r.vy >= -40 || r.y <= r.ty) { explode(r); return false; }
      return true;
    });

    // unde de șoc și fulgere locale
    shock = shock.filter(s => {
      s.r += 520 * dt; s.a -= dt * 1.7; if (s.a <= 0) return false;
      c.globalAlpha = s.a * .45; c.strokeStyle = s.col; c.lineWidth = 2;
      c.beginPath(); c.arc(s.x, s.y, s.r, 0, 7); c.stroke(); return true;
    });
    flashes = flashes.filter(f => {
      f.a -= dt * 4; if (f.a <= 0) return false;
      c.globalAlpha = f.a; c.fillStyle = f.col; c.beginPath(); c.arc(f.x, f.y, f.r * (1.4 - f.a * .4), 0, 7); c.fill(); return true;
    });

    // particule: linii de dâră + sclipiri
    const keep = [];
    c.lineCap = 'round';
    for (const p of parts) {
      p.age += dt;
      if (p.age >= p.life) { if (p.crack) crackle(p); continue; }
      p.px = p.x; p.py = p.y;
      p.vy += p.g * dt; p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.spark && Math.random() < .35 && p.age < p.life * .85) add(p.x, p.y, rnd(-12, 12), rnd(0, 25), '#ffe9a8', rnd(.4, .9), 1.1, { g: 120, drag: 1, tw: 1 });
      const u = p.age / p.life;
      let a = Math.max(0, 1 - u * u);
      if (p.tw && Math.random() < p.tw * u) a *= .15;          // sclipire la final
      c.globalAlpha = a; c.strokeStyle = c.fillStyle = p.col;
      c.lineWidth = p.s * (1 - u * .5);
      c.beginPath(); c.moveTo(p.px, p.py); c.lineTo(p.x, p.y); c.stroke();
      if (u < .3 || p.crack) { c.beginPath(); c.arc(p.x, p.y, p.s * .8, 0, 7); c.fill(); }
      keep.push(p);
    }
    parts = keep;
    // cuvintele rămân pe cer
    const tn = now / 1000 * SPEED;
    for (let wi = 0; wi < words.length; wi++) {
      const w = words[wi], age = tn - w.t0;
      c.fillStyle = rainbow ? `hsl(${(tn * 70 + wi * 30) % 360} 100% 68%)` : w.col;
      c.globalAlpha = .82 + .18 * Math.sin(tn * 2.4 + wi);
      for (const q of w.pts) {
        const u = (age - q.d) / q.dur;
        if (u <= 0) continue;
        let x = q.tx, y = q.ty;
        if (u < 1) { const e = 1 - Math.pow(1 - u, 3), sw = Math.sin(Math.PI * u); x = q.sx + (q.tx - q.sx) * e + q.jx * sw; y = q.sy + (q.ty - q.sy) * e + q.jy * sw; }
        c.fillRect(x - w.dot / 2, y - w.dot / 2, w.dot, w.dot);
      }
    }
    c.globalAlpha = 1;
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
