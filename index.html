<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Plic</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #fff; }
  body { touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  #world {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    transform-origin: 0 0; will-change: transform;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #000;
  }
  .gift { display: block; cursor: default; position: relative; z-index: 2; -webkit-tap-highlight-color: transparent; }
  .gift.ready { cursor: pointer; animation: wiggle 2.4s ease-in-out infinite; }
  @keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-8deg); } 82% { transform: rotate(8deg); } 88% { transform: rotate(-5deg); } 94% { transform: rotate(3deg); } }
  p { margin: 0; min-height: 1.8em; padding: 0 20px; align-self: stretch; text-align: left; font: 600 17px/1.4 -apple-system, 'SF Pro Display', system-ui, 'Segoe UI', sans-serif; letter-spacing: -.01em; color: #000; }
  .ch { display: inline-block; opacity: 0; animation: ios 1.1s cubic-bezier(.2,.8,.2,1) forwards, glow 2.4s ease-out forwards; animation-delay: calc(var(--i) * var(--gap)), calc(var(--i) * var(--gap)); }
  #scene { position: fixed; inset: 0; z-index: 5; overflow: hidden; pointer-events: none; will-change: transform; }
  #ground { position: absolute; left: 0; right: 0; height: 3px; background: #000; opacity: 0; transition: opacity .4s; }
  #parcel { position: absolute; display: block; fill: #000; transition: opacity .3s; }
  #parcel .w { fill: #fff; }
  #lid { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); transition: transform .4s ease; }
  #lid.shut { transform: scaleY(1); }
  #tape { opacity: 0; transition: opacity .3s; }
  #tape.on { opacity: 1; }
  #door { position: absolute; width: 84px; height: 140px; opacity: 0; transition: opacity .6s; perspective: 500px; pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #door.ready { animation: wiggle 2.4s ease-in-out infinite; }
  #hole { position: absolute; inset: 0; background: #000; }
  #leaf { position: absolute; inset: 0; background: #fff; border: 4px solid #000; box-sizing: border-box; transform-origin: left center; transition: transform .9s ease; backface-visibility: hidden; }
  #leaf::before { content: ''; position: absolute; inset: var(--pi, 14px 14px 40px 14px); border: 2px solid #000; }
  #leaf b { position: absolute; top: 24px; left: 0; right: 0; text-align: center; font: 700 24px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #000; }
  #leaf i { position: absolute; right: 15px; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: #000; }
  #present { position: fixed; left: 50%; top: 42%; width: 170px; height: 136px; margin: -68px 0 0 -85px; z-index: 7; opacity: 0; transform: scale(.08) translateY(60px); transition: transform 1.3s cubic-bezier(.2,1.25,.4,1), opacity .5s; }
  #present.in { opacity: 1; transform: none; }
#present svg { transform-origin: 50% 100%; }
#present.charge svg { animation: charge 1.6s linear forwards; }
#present.charge #plid { transform: translateY(-5px); }
#present.open svg { animation: release .5s cubic-bezier(.2,1.6,.4,1); }
@keyframes charge {
  0%   { transform: scale(1,1) rotate(0); animation-timing-function: ease-in; }
  25%  { transform: scale(1.06,.88) rotate(0); }
  35%  { transform: scale(.97,1.06) rotate(-1deg); }
  45%  { transform: scale(1.08,.9) rotate(1.5deg); }
  55%  { transform: scale(.95,1.1) rotate(-2deg); }
  65%  { transform: scale(1.1,.88) rotate(2.5deg); }
  75%  { transform: scale(.94,1.12) rotate(-3deg); }
  85%  { transform: scale(1.12,.86) rotate(3deg); }
  100% { transform: scale(1.14,.8) rotate(0); }
}
@keyframes release {
  from { transform: scale(1.14,.8); }
  to   { transform: none; }
}
  #present svg { display: block; overflow: visible; }
  #present .b { fill: #000; stroke: #fff; stroke-width: 2; stroke-linejoin: round; }
  #present .w { fill: #fff; }
#plid { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .5s cubic-bezier(.3,1.4,.5,1); }
#present.open #plid { transform: translate(-50px, -60px) rotate(-95deg); }
  #present .sp { position: absolute; top: 30%; left: 50%; font-size: 20px; opacity: 0; }
  #present.open .sp { animation: rise 1.4s ease-out forwards; }
  @keyframes rise { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), -90px); } }
  #msg { position: fixed; left: 0; right: 0; top: calc(42% + 100px); z-index: 9; padding: 0 20px; text-align: left; color: #fff; font: 600 17px/1.4 -apple-system, 'SF Pro Display', system-ui, 'Segoe UI', sans-serif; letter-spacing: -.01em; opacity: 0; }
  #msg.on { opacity: 1; }
  #msg span { display: inline-block; opacity: 0; }
  #msg.on span { animation: ios 1.1s cubic-bezier(.2,.8,.2,1) forwards, glow 2.4s ease-out forwards; animation-delay: calc(var(--i) * 260ms), calc(var(--i) * 260ms); }
  @keyframes ios { from { opacity: 0; filter: blur(16px); transform: translateY(10px) scale(.92); } to { opacity: 1; filter: blur(0); transform: none; } }
  @keyframes glow { 0% { text-shadow: 0 0 24px #bf5af2, 0 0 44px #0a84ff; } 100% { text-shadow: 0 0 0 transparent, 0 0 0 transparent; } }
  #gift { opacity: 0; }
  .bd { position: absolute; opacity: 0; transition: opacity .6s; perspective: 300px; pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .bd::before { content: ''; position: absolute; inset: -16px; }
  .bd.ready { animation: wiggle 2.4s ease-in-out infinite; }
  .bd .bh { position: absolute; inset: 0; background: #000; }
  .bd .bl { position: absolute; top: 0; bottom: 0; width: 50%; background: #fff; border: 2px solid #000; box-sizing: border-box; transition: transform .9s ease; backface-visibility: hidden; }
  .bd .bl.l { left: 0; transform-origin: left center; }
  .bd .bl.r { right: 0; transform-origin: right center; }
  .bd .bl::after { content: ''; position: absolute; top: 50%; width: 4px; height: 4px; border-radius: 50%; background: #000; }
  .bd .bl.l::after { right: 3px; }
  .bd .bl.r::after { left: 3px; }
  #stairs { position: absolute; inset: 0; background: #fff; pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #stairs svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .4s; }
  #si { position: absolute; left: 20px; top: calc(env(safe-area-inset-top, 0px) + 28px); color: #000; font-family: -apple-system, 'SF Pro Display', system-ui, 'Segoe UI', sans-serif; }
  #si b { display: block; font: 600 17px/1.4 -apple-system, 'SF Pro Display', system-ui, 'Segoe UI', sans-serif; letter-spacing: -.01em; }
  #si span { font-size: 13px; line-height: 1.4; opacity: .6; }
  #hint { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 28px); left: 0; right: 0; z-index: 8; box-sizing: border-box; pointer-events: none; }
  #dlg { position: fixed; left: 0; top: 46%; width: 100%; box-sizing: border-box; padding: 0 20px; transform: translateY(-50%); opacity: 0; transition: opacity .6s; z-index: 4; color: #000; text-align: left; font-family: -apple-system, 'SF Pro Display', system-ui, 'Segoe UI', sans-serif; }
  #dlg.in { opacity: 1; }
  #dlg .nm { font-weight: 700; font-size: 13px; margin-bottom: 10px; }
  #dlg .tx { font-size: 16px; line-height: 1.4; font-weight: 600; letter-spacing: -.01em; min-height: 7em; }
  #dlg .ch { animation: ios 1.1s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i) * var(--gap)); }
  #dlg .bt { display: flex; justify-content: flex-start; gap: 24px; margin-top: 18px; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #dlg .bt.on { opacity: 1; pointer-events: auto; }
  #dlg .slot { width: 120px; height: 52px; display: flex; align-items: center; justify-content: center; }
  #dlg button { width: 120px; height: 52px; font: 600 15px -apple-system, system-ui, sans-serif; border-radius: 26px; border: 2px solid #000; background: #fff; color: #000; cursor: pointer; transition: transform .3s cubic-bezier(.2,.8,.2,1); -webkit-tap-highlight-color: transparent; }
  #dlg #yes { background: #000; color: #fff; }
  #dlg .slot { position: relative; }
  #dlg .pt { position: absolute; left: 40px; top: 54px; width: 130px; height: 64px; pointer-events: none; color: #000; }
  #dlg .pt svg { position: absolute; left: 0; top: 0; overflow: visible; }
  #dlg .pt span { position: absolute; left: 0; top: 40px; font: 700 14px/1.2 -apple-system, system-ui, 'Segoe UI', sans-serif; white-space: nowrap; }
</style>
</head>
<body>
  <div id="world">
    <svg class="gift" id="gift" viewBox="0 0 64 64" width="64" height="64" role="button" aria-label="Plic">
      <rect x="6" y="16" width="52" height="36" rx="3" fill="#000"/>
      <path d="M10 21 L32 39 L54 21" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M11 48 L25 34 M53 48 L39 34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <p id="txt"></p>
  </div>
  <p id="hint"></p>
<script>
  const t = document.getElementById('txt');
  const wait = ms => new Promise(r => setTimeout(r, ms));

  /* ===== SUNETE (sintetizate, fara fisiere) ===== */
  const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (_) {} };
  const SFX = (() => {
    let ac, mg, nb, eng = null, lastBump = 0, foot = false;
    const init = () => {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); mg = ac.createGain(); mg.gain.value = .6; mg.connect(ac.destination);
    nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    ac.onstatechange = () => { if (ac.state === 'running') music.start(); };
  }
  if (ac.state === 'suspended') ac.resume().then(() => { if (ac.state === 'running') music.start(); }).catch(() => {});
  else if (ac.state === 'running') music.start();
};
    const env = (g, t0, d, v, a, rise) => {
      g.gain.setValueAtTime(.0001, t0);
      if (rise) { g.gain.exponentialRampToValueAtTime(v, t0 + d * .95); g.gain.linearRampToValueAtTime(.0001, t0 + d); }
      else { g.gain.linearRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); }
    };
const tone = (f, d, o = {}) => {
  if (!ac) return;
  const { type = 'sine', v = .25, at = 0, to = f, a = .008, rise = false, dest = null } = o, t0 = ac.currentTime + at;
  const os = ac.createOscillator(), g = ac.createGain();
  os.type = type; os.frequency.setValueAtTime(f, t0); os.frequency.exponentialRampToValueAtTime(Math.max(1, to), t0 + d);
  env(g, t0, d, v, a, rise); os.connect(g); g.connect(dest || mg); os.start(t0); os.stop(t0 + d + .05);
};
const noise = (d, o = {}) => {
  if (!ac) return;
  const { v = .25, at = 0, f = 1000, to = f, q = 1, type = 'bandpass', a = .01, rise = false, dest = null } = o, t0 = ac.currentTime + at;
  const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = nb; s.loop = true; fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f, t0); fl.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + d);
  env(g, t0, d, v, a, rise); s.connect(fl); fl.connect(g); g.connect(dest || mg); s.start(t0); s.stop(t0 + d + .05);
};
    // ---- melodie de fundal: aventura usoara, in bucla (8 masuri, La minor) ----
    const music = (() => {
      let mus = null, timer = null, step = 0, next = 0, lvl = .6;
      let eighth = 60 / 108 / 2, mode = 'calm'; const mf = m => 440 * Math.pow(2, (m - 69) / 12);
      const CH = [
        { b: 45, a: [57, 60, 64, 69] }, { b: 41, a: [53, 57, 60, 65] }, { b: 48, a: [60, 64, 67, 72] }, { b: 43, a: [55, 59, 62, 67] },
        { b: 45, a: [57, 60, 64, 69] }, { b: 41, a: [53, 57, 60, 65] }, { b: 43, a: [55, 59, 62, 67] }, { b: 40, a: [52, 56, 59, 64] }
      ];
      const ARP = [0, 1, 2, 3, 2, 1, 2, 1], _ = null;
      const MEL = [
        [76, _, _, 72, 69, _, 72, _], [74, _, _, 69, 65, _, 69, _], [72, _, 76, _, 79, _, 76, _], [74, _, 71, _, 67, _, _, _],
        [76, _, _, 72, 69, _, 72, 76], [77, _, _, 74, 72, _, 69, _], [74, _, 71, _, 74, _, 79, _], [76, _, 71, _, 68, _, _, _]
      ];
      const DMEL = [
        [69, 72, 76, 72, 69, 72, 76, 81], [77, 74, 72, 74, 77, 74, 72, 69], [72, 76, 79, 76, 72, 76, 79, 84], [79, 74, 71, 74, 79, 74, 71, 67],
        [76, _, 76, 77, 76, 72, 69, 72], [74, _, 74, 77, 74, 72, 69, 65], [71, 74, 79, 74, 71, 74, 79, 83], [80, 76, 71, 76, 80, 76, 83, _]
      ];
      // melodia vesela (pentru bloc si scari): Do major, oom-pah, acorduri pe contratimp
      const HCH = [
        { b: 48, c: [60, 64, 67] }, { b: 43, c: [59, 62, 67] }, { b: 45, c: [57, 60, 64] }, { b: 41, c: [57, 60, 65] },
        { b: 48, c: [60, 64, 67] }, { b: 43, c: [59, 62, 67] }, { b: 41, c: [57, 60, 65] }, { b: 43, c: [59, 62, 67] }
      ];
      const HMEL = [
        [76, _, 79, 76, 72, _, 76, _], [74, _, 79, 74, 71, _, 74, _], [72, _, 76, 72, 69, _, 72, 76], [77, _, 72, _, 77, 79, 77, _],
        [76, _, 79, 76, 84, _, 79, 76], [74, 71, 74, 79, 74, _, 71, _], [72, _, 77, 72, 69, _, 72, 77], [71, 74, 79, _, 77, 74, 71, _]
      ];
      // melodie dulce, ca de cutie muzicala (Do major), pentru chenare
      const QCH = [
        { b: 48, c: [60, 64, 67] }, { b: 45, c: [57, 60, 64] }, { b: 41, c: [57, 60, 65] }, { b: 43, c: [55, 59, 62] },
        { b: 48, c: [60, 64, 67] }, { b: 45, c: [57, 60, 64] }, { b: 41, c: [57, 60, 65] }, { b: 43, c: [55, 59, 62] }
      ];
      const QMEL = [
        [79, _, 76, _, 72, _, 76, _], [76, _, 72, _, 69, _, 72, _], [77, _, 74, _, 72, _, 69, _], [74, _, 71, _, 67, _, 71, 74],
        [79, _, 84, _, 79, _, 76, _], [81, _, 76, _, 72, _, 76, _], [77, _, 81, _, 77, _, 74, _], [74, _, 71, _, 67, _, _, _]
      ];
      const sched = () => {
        while (next < ac.currentTime + .5) {
          const bar = Math.floor(step / 8) % 8, s = step % 8, at = Math.max(0, next - ac.currentTime), c = CH[bar];
          if (mode === 'drive') {
            // cursa: bas pe fiecare optime, bataie pe fiecare timp, hi-hat pe contratimp, lead de aventura
            const m = DMEL[bar][s];
            tone(mf(c.b), .14, { v: s % 2 ? .07 : .1, at, dest: mus, a: .005 });
            if (s % 2 === 0) tone(110, .12, { v: .16, at, dest: mus, to: 45 });
            else noise(.04, { v: .035, at, f: 7000, type: 'highpass', dest: mus });
            if (m) { tone(mf(m), .2, { v: .08, at, dest: mus, type: 'triangle', a: .004 }); tone(mf(m + 12), .12, { v: .02, at, dest: mus }); }
          } else if (mode === 'happy') {
            // vesel: bas oom-pah, acorduri scurte pe contratimp, melodie saltareata
            const h = HCH[bar], m = HMEL[bar][s];
            if (s === 0) { tone(mf(h.b), .3, { v: .14, at, dest: mus, a: .006 }); tone(mf(h.b + 12), .2, { v: .04, at, dest: mus }); }
            if (s === 4) tone(mf(h.b + 7), .25, { v: .1, at, dest: mus, a: .006 });
            if (s === 2 || s === 6) h.c.forEach(n => tone(mf(n), .13, { v: .04, at, dest: mus, type: 'triangle', a: .004 }));
            if (s % 2) noise(.03, { v: .02, at, f: 8000, type: 'highpass', dest: mus });
                        if (m) { tone(mf(m), .3, { v: .09, at, dest: mus, type: 'triangle', a: .005 }); tone(mf(m + 12), .18, { v: .03, at, dest: mus }); }
          } else if (mode === 'cute') {
            const q = QCH[bar], m = QMEL[bar][s];
            if (s === 0) tone(mf(q.b), .9, { v: .09, at, dest: mus, a: .01 });
            if (s % 2) tone(mf(q.c[(s >> 1) % 3]), .35, { v: .03, at, dest: mus, type: 'triangle', a: .005 });
            if (m) { tone(mf(m), 1, { v: .08, at, dest: mus, a: .004 }); tone(mf(m + 12), .5, { v: .03, at, dest: mus }); tone(mf(m + 19), .25, { v: .012, at, dest: mus }); }
          } else {
            const m = MEL[bar][s];
            if (s === 0 || s === 4) tone(mf(c.b), .5, { v: .12, at, dest: mus, a: .01 });
            if (s === 6) tone(mf(c.b + 7), .3, { v: .06, at, dest: mus });
            tone(mf(c.a[ARP[s]]), .28, { v: .05, at, dest: mus, type: 'triangle', a: .004 });
            if (m) { tone(mf(m), .55, { v: .1, at, dest: mus, a: .01 }); tone(mf(m + 12), .3, { v: .025, at, dest: mus, type: 'triangle' }); }
            if (s === 2 || s === 6) tone(900, .05, { v: .045, at, dest: mus, type: 'triangle', to: 600 });
          }
          next += eighth; step++;
        }
      };
      return {
        start() {
          if (timer || !ac) return;
          mus = ac.createGain(); mus.gain.setValueAtTime(.0001, ac.currentTime); mus.gain.linearRampToValueAtTime(lvl, ac.currentTime + .4); mus.connect(mg);
          next = ac.currentTime + .15; timer = setInterval(sched, 120);
        },
        mode(m) {
          const TEMPO = { calm: 108, drive: 150, happy: 126, cute: 88 }, LVL = { calm: .6, drive: .85, happy: .65, cute: .7 };
          mode = m; eighth = 60 / TEMPO[m] / 2;
          if (ac) { step = 0; next = ac.currentTime + .08; }
          this.level(LVL[m], m === 'drive' ? .5 : m === 'cute' ? 3 : 1.2);
        },
        level(v, secs = 1) {
          lvl = v; if (!mus) return; const t = ac.currentTime;
          mus.gain.cancelScheduledValues(t); mus.gain.setValueAtTime(mus.gain.value, t); mus.gain.linearRampToValueAtTime(v, t + secs);
        }
      };
    })();
    const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
    const HB = [[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],
                [392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,2],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2]];
    return {
      init,
      tick: () => tone([1047, 1175, 1319, 1568][Math.floor(Math.random() * 4)], .08, { v: .03 }),
      yes: () => { tone(520, .1, { v: .14, to: 780 }); tone(780, .16, { v: .14, to: 1040, at: .08 }); },
      no: () => tone(440, .2, { type: 'triangle', v: .1, to: 300 }),
      appear: () => [523, 659, 784].forEach((f, i) => { tone(f, .45, { v: .13, at: i * .08 }); tone(f * 2, .25, { v: .04, at: i * .08 }); }),
      whoosh: (d = .5, up = true) => { noise(d, { v: .1, f: up ? 600 : 2200, to: up ? 2200 : 600, q: .6, a: d * .3 }); tone(up ? 500 : 1100, d, { v: .04, to: up ? 1100 : 500, a: d * .3 }); },
      thump: (v = .5) => tone(190, .16, { v: v * .45, to: 95 }),
      bump() { const n = performance.now(); if (n - lastBump < 150) return; lastBump = n; tone(300, .1, { type: 'triangle', v: .1, to: 220 }); vib(8); },
      win: () => [784, 988, 1175, 1568].forEach((f, i) => { tone(f, .45, { v: .13, at: i * .09 }); tone(f * 2, .25, { v: .035, at: i * .09 }); }),
      stretch: d => tone(300, d, { v: .08, to: 700, rise: true }),
      boing: () => { tone(300, .12, { v: .14, to: 600 }); tone(600, .25, { v: .12, to: 300, at: .1 }); },
      rip: () => [0, .06, .12].forEach(t => noise(.1, { at: t, v: .12, f: 3000, to: 5000, q: 1 })),
      pass: () => { noise(.6, { v: .05, f: 600, to: 1700, q: .6, a: .18 }); noise(.5, { v: .02, f: 1200, to: 500, q: .5, type: 'lowpass', a: .15 }); },
      crash: () => { tone(330, .3, { type: 'triangle', v: .2, to: 110 }); noise(.25, { v: .15, f: 900, to: 200, q: .5, type: 'lowpass' }); vib(80); },
      // in cursa masina nu se aude: doar muzica de aventura (mod rapid)
      engOn() { music.mode('drive'); },
      engRev() {},
      engOff() { music.level(.0001, .8); },
      happy: () => music.mode('happy'),
      cute: () => music.mode('cute'),
      rumble: () => noise(2.2, { v: .2, f: 250, to: 90, q: .7, type: 'lowpass', a: .3 }),

// 7 benzi verticale peste capacul cutiei (pornesc din gura corpului); dupa 2s rosul coboara foarte rapid peste tot
function stain(G) {
  const W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  const mk = z => {
    const cv = document.createElement('canvas');
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.cssText = `position:fixed;inset:0;width:100%;height:100%;z-index:${z};pointer-events:none`;
    document.body.appendChild(cv);
    return cv.getContext('2d');
  };
  const cb = mk(6);   // benzi: peste cutie si capac (cutia are z-index 7)
  const cr = mk(8);   // rosu: creat al doilea, deci e peste benzi (si peste cutie)

  const r0 = G.getBoundingClientRect();
  const bodyL = r0.left + r0.width * .06, bodyW = r0.width * .88;   // corpul cutiei
  const oy = r0.top + r0.height * .55;                              // marginea de sus a corpului (24/80)
  const LW = bodyW / 7;

  const RB = ['#ff1744', '#ff7a00', '#ffd000', '#2bd96b', '#1e90ff', '#5b3df5', '#b33dff'];
  const RED = '#e8112d';
  const bands = RB.map((col, i) => ({ col, x: bodyL + i * LW, h: 0 }));
  const SPEED = 2600;

  const cw = Math.max(26, W / 14);
  const drips = [];
  for (let x = -cw; x < W + cw * 2; x += cw * .8) {
    drips.push({
      x, w: cw * (1.7 + Math.random() * .5),
      delay: 1 + Math.random() * .1,
      v: 1400 + Math.random() * 500, a: 7000 + Math.random() * 2500,
      ph: Math.random() * 6.28, bulb: 1.08 + Math.random() * .2, y: -30
    });
  }

  const born = performance.now(); let last = born;
  const tick = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const age = (now - born) / 1000;

    // benzile cresc in sus, peste capac
    cb.setTransform(dpr, 0, 0, dpr, 0, 0);
    cb.clearRect(0, 0, W, H);
    for (const b of bands) {
      b.h += SPEED * dt;
      cb.fillStyle = b.col;
      cb.fillRect(b.x - .5, oy - b.h, LW + 1, b.h);
    }

    // rosul
    cr.setTransform(dpr, 0, 0, dpr, 0, 0);
    cr.clearRect(0, 0, W, H);
    let allDone = true;
    cr.fillStyle = RED; cr.strokeStyle = RED;
    for (const d of drips) {
      const t = Math.max(0, age - d.delay);
      if (t > 0) d.y = -30 + d.v * t + .5 * d.a * t * t;
      if (d.y < H + d.w) allDone = false;
      if (t <= 0) continue;
      const sway = Math.sin(age * 2 + d.ph) * 3;
      cr.lineWidth = d.w; cr.lineCap = 'butt';
      cr.beginPath(); cr.moveTo(d.x + sway, -40); cr.lineTo(d.x + sway, d.y); cr.stroke();
      cr.beginPath(); cr.arc(d.x + sway, d.y, d.w / 2 * d.bulb, 0, 7); cr.fill();
    }

    if (!allDone) requestAnimationFrame(tick);
    else { cr.fillStyle = RED; cr.fillRect(0, 0, W, H); finale(W, H, dpr); }
  };
  requestAnimationFrame(tick);
}

function makeCard(item, W, dpr) {
  const w = Math.floor(Math.min((W - 32 - 14) / 2, 200)), h = Math.round(w * .85);
  const card = document.createElement('div');
  card.style.cssText = `position:relative;width:${w}px;height:${h}px;background:#fff;border:3px solid #000;border-radius:18px;overflow:hidden;box-sizing:border-box;box-shadow:6px 6px 0 #000`;

  // continutul de sub strat (poza sau text)
  if (item.img) {
    const im = document.createElement('img');
    im.src = item.img; im.draggable = false;
    im.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;pointer-events:none';
    card.appendChild(im);
  } else {
    const tx = document.createElement('div');
    tx.textContent = item.text;
    tx.style.cssText = "position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font:700 20px/1.4 -apple-system,'SF Pro Display',system-ui,sans-serif;color:#000";
    card.appendChild(tx);
  }

  // stratul care se razuieste
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;transition:opacity .6s';
  card.appendChild(cv);
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = c.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, '#8d8d8d'); g.addColorStop(.5, '#cfcfcf'); g.addColorStop(1, '#8d8d8d');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = '#000'; c.font = "700 18px -apple-system,system-ui,sans-serif";
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('Răzuiește', w / 2, h / 2);

  let down = false, lx = 0, ly = 0, gone = false, lastTick = 0;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const line = (x, y) => {
    c.globalCompositeOperation = 'destination-out';
    c.lineWidth = 42; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(lx, ly); c.lineTo(x, y); c.stroke();
    lx = x; ly = y;
  };
  const check = () => {
    if (gone) return;
    const d = c.getImageData(0, 0, cv.width, cv.height).data;
    let clear = 0, total = 0;
    for (let i = 3; i < d.length; i += 4 * 12) { total++; if (d[i] === 0) clear++; }
    if (clear / total > .5) {
      gone = true; cv.style.opacity = 0; cv.style.pointerEvents = 'none';
      SFX.sparkle(); vib(30);
      setTimeout(() => cv.remove(), 700);
    }
  };
  cv.addEventListener('pointerdown', e => {
    down = true; [lx, ly] = pos(e);
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    line(lx + .1, ly + .1);
  });
  cv.addEventListener('pointermove', e => {
    if (!down || gone) return;
    const [x, y] = pos(e); line(x, y);
    const n = performance.now(); if (n - lastTick > 110) { lastTick = n; SFX.tick(); }
  });
  const up = () => { if (!down) return; down = false; check(); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  return card;
}
