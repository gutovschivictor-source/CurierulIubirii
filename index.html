<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Plic</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #fff; }
  body { touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  #world {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    transform-origin: 0 0; will-change: transform;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #000;
  }
  .gift { display: block; cursor: default; position: relative; z-index: 2; -webkit-tap-highlight-color: transparent; }
  .gift.ready { cursor: pointer; animation: wiggle 2.4s ease-in-out infinite; }
  @keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-8deg); } 82% { transform: rotate(8deg); } 88% { transform: rotate(-5deg); } 94% { transform: rotate(3deg); } }
  p { margin: 0; min-height: 1.8em; padding: 0 20px; align-self: stretch; text-align: left; font: 600 17px/1.4 -apple-system, 'SF Pro Display', system-ui, 'Segoe UI', sans-serif; letter-spacing: -.01em; color: #000; }
  .ch { display: inline-block; opacity: 0; animation: ios 1.1s cubic-bezier(.2,.8,.2,1) forwards, glow 2.4s ease-out forwards; animation-delay: calc(var(--i) * var(--gap)), calc(var(--i) * var(--gap)); }
  #scene { position: fixed; inset: 0; z-index: 5; overflow: hidden; pointer-events: none; will-change: transform; }
  #ground { position: absolute; left: 0; right: 0; height: 3px; background: #000; opacity: 0; transition: opacity .4s; }
  #parcel { position: absolute; display: block; fill: #000; transition: opacity .3s; }
  #parcel .w { fill: #fff; }
  #lid { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); transition: transform .4s ease; }
  #lid.shut { transform: scaleY(1); }
  #tape { opacity: 0; transition: opacity .3s; }
  #tape.on { opacity: 1; }
  #door { position: absolute; width: 84px; height: 140px; opacity: 0; transition: opacity .6s; perspective: 500px; pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #door.ready { animation: wiggle 2.4s ease-in-out infinite; }
  #hole { position: absolute; inset: 0; background: #000; }
  #leaf { position: absolute; inset: 0; background: #fff; border: 4px solid #000; box-sizing: border-box; transform-origin: left center; transition: transform .9s ease; backface-visibility: hidden; }
  #leaf::before { content: ''; position: absolute; inset: var(--pi, 14px 14px 40px 14px); border: 2px solid #000; }
  #leaf b { position: absolute; top: 24px; left: 0; right: 0; text-align: center; font: 700 24px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #000; }
  #leaf i { position: absolute; right: 15px; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: #000; }
  #present { position: fixed; left: 50%; top: 42%; width: 170px; height: 136px; margin: -68px 0 0 -85px; z-index: 7; opacity: 0; transform: scale(.08) translateY(60px); transition: transform 1.3s cubic-bezier(.2,1.25,.4,1), opacity .5s; }
  #present.in { opacity: 1; transform: none; }
  #present svg { display: block; overflow: visible; }
  #present .b { fill: #000; stroke: #fff; stroke-width: 2; stroke-linejoin: round; }
  #present .w { fill: #fff; }
  #plid { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .7s cubic-bezier(.3,1.4,.5,1); }
  #present.open #plid { transform: translateY(-30px) rotate(-16deg); }
  #present .sp { position: absolute; top: 30%; left: 50%; font-size: 20px; opacity: 0; }
  #present.open .sp { animation: rise 1.4s ease-out forwards; }
  @keyframes rise { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), -90px); } }
  #msg { position: fixed; left: 0; right: 0; top: calc(42% + 100px); z-index: 7; padding: 0 20px; text-align: left; color: #fff; font: 600 17px/1.4 -apple-system, 'SF Pro Display', system-ui, 'Segoe UI', sans-serif; letter-spacing: -.01em; opacity: 0; }
  #msg.on { opacity: 1; }
  #msg span { display: inline-block; opacity: 0; }
  #msg.on span { animation: ios 1.1s cubic-bezier(.2,.8,.2,1) forwards, glow 2.4s ease-out forwards; animation-delay: calc(var(--i) * 260ms), calc(var(--i) * 260ms); }
  @keyframes ios { from { opacity: 0; filter: blur(16px); transform: translateY(10px) scale(.92); } to { opacity: 1; filter: blur(0); transform: none; } }
  @keyframes glow { 0% { text-shadow: 0 0 24px #bf5af2, 0 0 44px #0a84ff; } 100% { text-shadow: 0 0 0 transparent, 0 0 0 transparent; } }
  #gift { opacity: 0; }
  .bd { position: absolute; opacity: 0; transition: opacity .6s; perspective: 300px; pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .bd::before { content: ''; position: absolute; inset: -16px; }
  .bd.ready { animation: wiggle 2.4s ease-in-out infinite; }
  .bd .bh { position: absolute; inset: 0; background: #000; }
  .bd .bl { position: absolute; top: 0; bottom: 0; width: 50%; background: #fff; border: 2px solid #000; box-sizing: border-box; transition: transform .9s ease; backface-visibility: hidden; }
  .bd .bl.l { left: 0; transform-origin: left center; }
  .bd .bl.r { right: 0; transform-origin: right center; }
  .bd .bl::after { content: ''; position: absolute; top: 50%; width: 4px; height: 4px; border-radius: 50%; background: #000; }
  .bd .bl.l::after { right: 3px; }
  .bd .bl.r::after { left: 3px; }
  #stairs { position: absolute; inset: 0; background: #fff; pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #stairs svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .4s; }
  #si { position: absolute; left: 20px; top: calc(env(safe-area-inset-top, 0px) + 28px); color: #000; font-family: -apple-system, 'SF Pro Display', system-ui, 'Segoe UI', sans-serif; }
  #si b { display: block; font: 600 17px/1.4 -apple-system, 'SF Pro Display', system-ui, 'Segoe UI', sans-serif; letter-spacing: -.01em; }
  #si span { font-size: 13px; line-height: 1.4; opacity: .6; }
  #hint { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 28px); left: 0; right: 0; z-index: 8; box-sizing: border-box; pointer-events: none; }
  #dlg { position: fixed; left: 0; top: 46%; width: 100%; box-sizing: border-box; padding: 0 20px; transform: translateY(-50%); opacity: 0; transition: opacity .6s; z-index: 4; color: #000; text-align: left; font-family: -apple-system, 'SF Pro Display', system-ui, 'Segoe UI', sans-serif; }
  #dlg.in { opacity: 1; }
  #dlg .nm { font-weight: 700; font-size: 13px; margin-bottom: 10px; }
  #dlg .tx { font-size: 16px; line-height: 1.4; font-weight: 600; letter-spacing: -.01em; min-height: 7em; }
  #dlg .ch { animation: ios 1.1s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i) * var(--gap)); }
  #dlg .bt { display: flex; justify-content: flex-start; gap: 24px; margin-top: 18px; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #dlg .bt.on { opacity: 1; pointer-events: auto; }
  #dlg .slot { width: 120px; height: 52px; display: flex; align-items: center; justify-content: center; }
  #dlg button { width: 120px; height: 52px; font: 600 15px -apple-system, system-ui, sans-serif; border-radius: 26px; border: 2px solid #000; background: #fff; color: #000; cursor: pointer; transition: transform .3s cubic-bezier(.2,.8,.2,1); -webkit-tap-highlight-color: transparent; }
  #dlg #yes { background: #000; color: #fff; }
  #dlg .slot { position: relative; }
  #dlg .pt { position: absolute; left: 40px; top: 54px; width: 130px; height: 64px; pointer-events: none; color: #000; }
  #dlg .pt svg { position: absolute; left: 0; top: 0; overflow: visible; }
  #dlg .pt span { position: absolute; left: 0; top: 40px; font: 700 14px/1.2 -apple-system, system-ui, 'Segoe UI', sans-serif; white-space: nowrap; }
</style>
</head>
<body>
  <div id="world">
    <svg class="gift" id="gift" viewBox="0 0 64 64" width="64" height="64" role="button" aria-label="Plic">
      <rect x="6" y="16" width="52" height="36" rx="3" fill="#000"/>
      <path d="M10 21 L32 39 L54 21" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M11 48 L25 34 M53 48 L39 34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <p id="txt"></p>
  </div>
  <p id="hint"></p>
<script>
  const t = document.getElementById('txt');
  const wait = ms => new Promise(r => setTimeout(r, ms));
  // sageata curbata + text, fixe langa butonul "Nu" (nu dispar la apasare)
  const ARROW = '<div class="pt"><svg viewBox="0 0 120 56" width="120" height="56"><path d="M96 38 C100 22 80 10 66 4" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/><path d="M72.7 13 L66 4 L77.2 4" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Apasa aici🙌</span></div>';

  // dialog Bob Blup reutilizabil: se rezolva cand apesi Da; Nu micsoreaza butonul
  async function bobAsk(msg, gap) {
    const D = document.createElement('div'); D.id = 'dlg'; D.style.zIndex = 9;
    D.innerHTML = '<div class="nm">Bob Blup</div><div class="tx"></div><div class="bt"><div class="slot"><button id="yes">Da</button></div><div class="slot"><button id="no">Nu</button>' + ARROW + '</div></div>';
    document.body.appendChild(D);
    D.getBoundingClientRect(); D.classList.add('in');
    await wait(500);
    await wait(show(msg.split(' ').join('|'), gap, D.querySelector('.tx')));
    D.querySelector('.bt').classList.add('on');
    let sz = 1; const no = D.querySelector('#no');
    no.onclick = () => { sz *= .7; no.style.transform = `scale(${sz})`; };
    await new Promise(res => { D.querySelector('#yes').onclick = res; });
    D.style.pointerEvents = 'none'; D.classList.remove('in'); await wait(700); D.remove();
  }

  // jocul: condus prin trafic, ocolesti 31 de masini (daca lovesti, o iei de la capat)
  function drive(sc, hint) {
    return new Promise(res => {
      const W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
      const cv = document.createElement('canvas');
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.2s ease-out;pointer-events:auto;touch-action:none';
      sc.appendChild(cv);
      const c = cv.getContext('2d');
      const N = 31, LANES = 4, Rw = Math.min(W * .9, 340), rx = (W - Rw) / 2, lane = Rw / LANES;
      const cw = Math.min(lane * .6, 46), ch = cw * 1.9, SP = ch * 3.4, V = 300;
      const pyT = H * .78, Tin = Math.sqrt(2 * (H + ch - pyT) / 420);
      let py = H + ch, fin = 0, vy = 0, fading = false, introT = 0;
      const minX = rx + cw * .7, maxX = rx + Rw - cw * .7;
      const clamp = x => Math.max(minX, Math.min(maxX, x));
      let px = W / 2, cars = [], passed = 0, scroll = 0, flash = 0, msgT = 0, kl = 0, kr = 0, done = false, shown = -1;
      const setHint = (a, b) => { hint.innerHTML = `${a}<br><span style="font-size:13px;font-weight:400;opacity:.6">${b}</span>`; };
      const upd = () => { shown = passed; setHint('Condu prin trafic', `Trage degetul stanga-dreapta · ${passed} / ${N}`); };
      const build = () => {
        cars = []; let n = 0, row = 0;
        while (n < N) {
          const two = n < N - 1 && Math.random() < .4;
          const ls = [0, 1, 2, 3].sort(() => Math.random() - .5).slice(0, two ? 2 : 1);
          ls.forEach(l => { cars.push({ x: rx + lane * (l + .5) + (Math.random() - .5) * lane * .2, y: -ch - row * SP - H * .25, p: false }); n++; });
          row++;
        }
        passed = 0;
      };
      build(); upd();
      let pid = null, lx = 0;
      const pd = e => { if (pid !== null) return; pid = e.pointerId; lx = e.clientX; try { cv.setPointerCapture(pid); } catch (_) {} };
      const pm = e => { if (e.pointerId !== pid) return; px = clamp(px + (e.clientX - lx) * 1.4); lx = e.clientX; };
      const pu = e => { if (e.pointerId === pid) pid = null; };
      const kdn = e => { if (e.key === 'ArrowLeft') kl = 1; if (e.key === 'ArrowRight') kr = 1; };
      const kup = e => { if (e.key === 'ArrowLeft') kl = 0; if (e.key === 'ArrowRight') kr = 0; };
      cv.addEventListener('pointerdown', pd); cv.addEventListener('pointermove', pm);
      cv.addEventListener('pointerup', pu); cv.addEventListener('pointercancel', pu);
      addEventListener('keydown', kdn); addEventListener('keyup', kup);

      const car = (x, y, dir, me) => {
        const x0 = x - cw / 2, y0 = y - ch / 2;
        c.lineWidth = 3; c.strokeStyle = '#000'; c.fillStyle = me ? '#000' : '#fff';
        c.beginPath(); c.roundRect ? c.roundRect(x0, y0, cw, ch, cw * .28) : c.rect(x0, y0, cw, ch); c.fill(); c.stroke();
        c.fillStyle = '#000';
        for (const fy of [.12, .68]) { c.fillRect(x0 - 3, y0 + ch * fy, 4, ch * .2); c.fillRect(x0 + cw - 1, y0 + ch * fy, 4, ch * .2); }
        c.fillStyle = me ? '#fff' : '#000';
        c.fillRect(x0 + cw * .16, dir < 0 ? y0 + ch * .2 : y0 + ch * .6, cw * .68, ch * .2);
        c.fillRect(x0 + cw * .2, dir < 0 ? y0 + ch * .72 : y0 + ch * .12, cw * .6, ch * .12);
      };
      const draw = () => {
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
        c.strokeStyle = '#000'; c.lineWidth = 4; c.lineCap = 'butt';
        c.beginPath(); c.moveTo(rx, 0); c.lineTo(rx, H); c.moveTo(rx + Rw, 0); c.lineTo(rx + Rw, H); c.stroke();
        c.lineWidth = 3; c.setLineDash([28, 28]); c.lineDashOffset = -scroll;
        c.beginPath(); for (let i = 1; i < LANES; i++) { c.moveTo(rx + lane * i, 0); c.lineTo(rx + lane * i, H); } c.stroke();
        c.setLineDash([]);
        for (const k of cars) if (k.y > -ch && k.y < H + ch) car(k.x, k.y, 1, false);
        car(px, py, -1, true);
        if (flash > 0) { c.fillStyle = `rgba(0,0,0,${flash * .6})`; c.fillRect(0, 0, W, H); }
      };
      let last = performance.now();
      const tick = now => {
        if (done) return;
        const dt = Math.min(.05, (now - last) / 1000); last = now;
        px = clamp(px + (kr - kl) * 360 * dt);
        scroll += V * dt; let crash = false;
        if (introT < Tin) { introT = Math.min(Tin, introT + dt); py = pyT + 210 * (Tin - introT) * (Tin - introT); }
        for (const k of cars) {
          k.y += V * dt;
          if (!k.p && k.y - ch / 2 > py + ch / 2) { k.p = true; passed++; }
          if (!fin && Math.abs(k.x - px) < cw * .88 && Math.abs(k.y - py) < ch * .92) crash = true;
        }
        if (fin) {
          // masina isi continua drumul, accelereaza usor si se pierde in departare
          fin += dt; vy += 420 * dt; py -= vy * dt;
          if (!fading && fin > .5) {
            fading = true;
            cv.style.transition = 'opacity 1.8s ease-in'; cv.style.opacity = 0;
            hint.style.transition = 'opacity 1s'; hint.style.opacity = 0;
          }
          draw();
          if (fin > 2.6) {
            done = true; hint.innerHTML = ''; hint.style.opacity = ''; hint.style.transition = '';
            removeEventListener('keydown', kdn); removeEventListener('keyup', kup);
            cv.remove(); res(); return;
          }
          requestAnimationFrame(tick); return;
        }
        if (crash) { flash = 1; build(); setHint('Ai lovit! De la capat', 'Mai incearca o data'); msgT = 1.4; shown = -1; }
        else if (msgT > 0) { msgT -= dt; if (msgT <= 0) upd(); }
        else if (shown !== passed) upd();
        if (flash > 0) flash -= dt * 2.5;
        draw();
        if (passed >= N) { fin = .001; upd(); }
        requestAnimationFrame(tick);
      };
      draw(); cv.getBoundingClientRect(); cv.style.opacity = 1;
      setTimeout(() => { last = performance.now(); requestAnimationFrame(tick); }, 150);
    });
  }
  function show(msg, gap, el = t) {
    el.innerHTML = '';
    el.style.setProperty('--gap', gap + 'ms');
    const words = msg.split('|');
    words.forEach((w, i) => {
      const sp = document.createElement('span');
      sp.className = 'ch'; sp.style.setProperty('--i', i);
      sp.textContent = w;
      el.appendChild(sp);
      if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
    });
    return (words.length - 1) * gap + 1100;
  }
  // dialog: Bob Blup cere ajutorul; Da -> apare plicul si pornesc trimiterea, Nu -> doar butonul Nu se micsoreaza
  (async () => {
    await wait(1200);
    const D = document.createElement('div'); D.id = 'dlg';
    D.innerHTML = '<div class="nm">Bob Blup</div><div class="tx"></div><div class="bt"><div class="slot"><button id="yes">Da</button></div><div class="slot"><button id="no">Nu</button>' + ARROW + '</div></div>';
    document.body.appendChild(D);
    D.getBoundingClientRect(); D.classList.add('in');
    await wait(500);
    const tx = D.querySelector('.tx');
    await wait(show('— Salut, sunt Bob Blup, si vreau sa ma ajuti urgent cu un colet, doresti sa impachetezi un coletul cea mai frumoasa fata?😉'.split(' ').join('|'), 140, tx));
    D.querySelector('.bt').classList.add('on');
    let sz = 1; const no = D.querySelector('#no');
    no.onclick = () => { sz *= .7; no.style.transform = `scale(${sz})`; };
    D.querySelector('#yes').onclick = async () => {
      D.style.pointerEvents = 'none';
      D.classList.remove('in'); await wait(700); D.remove();
      const g = document.getElementById('gift');
      g.style.transition = 'opacity .6s'; g.style.opacity = 1;
      await wait(900); deliver();
    };
  })();

  // plicul intra in colet, coletul pleaca, ajunge undeva, apare o usa; o deschizi si totul devine negru
  async function deliver() {
    const g = document.getElementById('gift'), r = g.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, W = innerWidth, H = innerHeight;
    const sc = document.createElement('div'); sc.id = 'scene';
    sc.innerHTML = '<div id="ground"></div><svg id="parcel" viewBox="0 0 100 80"><rect x="6" y="24" width="88" height="50" rx="3"/><rect id="lid" x="2" y="12" width="96" height="16" rx="3"/><rect id="tape" class="w" x="44" y="12" width="12" height="62"/><rect class="w" x="14" y="44" width="22" height="16" rx="1"/></svg>';
    document.body.appendChild(sc);
    const P = sc.querySelector('#parcel'), ground = sc.querySelector('#ground');
    let pw = 120, k = pw / 100;
    const world = document.getElementById('world'), hint = document.getElementById('hint');

    // ---- labirint: userul duce plicul pana la colet ----
    const cell = Math.max(42, Math.min(60, Math.floor(W / 7)));
    const cols = Math.max(4, Math.min(5, Math.floor((W - 32) / cell)));
    const rows = Math.max(5, Math.min(8, Math.floor((H - 150) / cell)));
    const ML = Math.round((W - cols * cell) / 2);
    const MT = Math.round(100 + Math.max(0, (H - 100 - 24 - rows * cell) / 2));
    const lw = 5;
    // genereaza labirintul (DFS) -> V[r][c]: perete vertical la x=c, H[r][c]: perete orizontal la y=r
    const V = Array.from({ length: rows }, () => Array(cols + 1).fill(true));
    const Hh = Array.from({ length: rows + 1 }, () => Array(cols).fill(true));
    const seen = Array.from({ length: rows }, () => Array(cols).fill(false));
    const stack = [[0, 0]]; seen[0][0] = true;
    while (stack.length) {
      const [c, rr] = stack[stack.length - 1];
      const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dc, dr]) => [c + dc, rr + dr, dc, dr])
        .filter(([nc, nr]) => nc >= 0 && nc < cols && nr >= 0 && nr < rows && !seen[nr][nc]);
      if (!nb.length) { stack.pop(); continue; }
      const [nc, nr, dc, dr] = nb[Math.floor(Math.random() * nb.length)];
      if (dc === 1) V[rr][c + 1] = false; else if (dc === -1) V[rr][c] = false;
      else if (dr === 1) Hh[rr + 1][c] = false; else Hh[rr][c] = false;
      seen[nr][nc] = true; stack.push([nc, nr]);
    }
    const segs = []; let pd = '';
    for (let rr = 0; rr < rows; rr++) for (let c = 0; c <= cols; c++) if (V[rr][c]) { segs.push([c * cell, rr * cell, c * cell, (rr + 1) * cell]); pd += `M${c * cell} ${rr * cell}V${(rr + 1) * cell}`; }
    for (let rr = 0; rr <= rows; rr++) for (let c = 0; c < cols; c++) if (Hh[rr][c]) { segs.push([c * cell, rr * cell, (c + 1) * cell, rr * cell]); pd += `M${c * cell} ${rr * cell}H${(c + 1) * cell}`; }
    const mz = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    mz.setAttribute('width', cols * cell + lw * 2); mz.setAttribute('height', rows * cell + lw * 2);
    mz.setAttribute('viewBox', `${-lw} ${-lw} ${cols * cell + lw * 2} ${rows * cell + lw * 2}`);
    mz.style.cssText = `position:absolute;left:${ML - lw}px;top:${MT - lw}px;opacity:0;transition:opacity .6s`;
    mz.innerHTML = `<path d="${pd}" fill="none" stroke="#000" stroke-width="${lw}" stroke-linecap="round"/>`;
    sc.insertBefore(mz, P);

    // coletul sta in ultima celula
    const ex = ML + (cols - .5) * cell, ey = MT + (rows - .5) * cell;
    pw = cell * .8; k = pw / 100;
    P.style.cssText = `width:${pw}px;left:${ex - pw / 2}px;top:${ey - 49 * k}px;opacity:0`;
    await wait(30); mz.style.opacity = 1; P.style.opacity = 1;
    show('Împachetează|plicul!', 260, hint);

    // plicul se micsoreaza si se muta in prima celula
    const m = cell * .5 / 52, rad = cell * .17;
    const pos = { x: ML + cell / 2, y: MT + cell / 2 };
    let cur = { x: pos.x - cx, y: pos.y - cy };
    world.style.zIndex = 6;

        quad([Pj(x, FL, z1), Pj(x, FL, z2), Pj(x, FL - DH, z2), Pj(x, FL - DH, z1)], '#fff');
        c.lineWidth = Math.max(1, lwf(d) * .6);
        quad([Pj(x, FL - .2, z1 + .1), Pj(x, FL - .2, z2 - .1), Pj(x, FL - 1.2, z2 - .1), Pj(x, FL - 1.2, z1 + .1)]);
        const kp = Pj(x, FL - .65, z2 - .17);
        c.fillStyle = '#000'; c.beginPath(); c.arc(kp[0], kp[1], Math.max(1, f * .025 / d), 0, 7); c.fill();
      }
      if (withDoor) endDoor(cam, bob);
    };
    draw(0, 0, true);
    cv.getBoundingClientRect(); cv.style.opacity = 1;
    await wait(800);
    st.remove(); P.style.opacity = 0;
    // mersul pe hol (usor legănat), incet la inceput si la sfarsit
    const T = 5600;
    await new Promise(res => {
      const t0 = performance.now();
      const tick = now => {
        const u = Math.min(1, (now - t0) / T);
        const cam = ZE * (1 - Math.cos(Math.PI * u)) / 2;
        const bob = Math.sin(Math.PI * u) * Math.sin(u * 30) * 4;
        draw(cam, bob, true);
        if (u < 1) requestAnimationFrame(tick); else res();
      };
      requestAnimationFrame(tick);
    });
    // usa HTML (cu balama si clanta) se pune exact peste usa desenata
    const dd = L - ZE, dw = f * DW / dd, dh = f * DH / dd;
    const dl = hx - dw / 2, dtop = cy0 + f * (FL - DH) / dd;
    const d = document.createElement('div'); d.id = 'door';
    d.innerHTML = '<div id="hole"></div><div id="leaf"><b>16</b><i></i></div>';
    d.style.cssText = `left:${dl}px;top:${dtop}px;width:${dw}px;height:${dh}px;transition:none`;
    d.style.setProperty('--pi', `${dh * .1}px ${dw * .12}px ${dh * .29}px ${dw * .12}px`);
    d.querySelector('b').style.cssText = `top:${dh * .17}px;font-size:${dw * .29}px`;
    sc.appendChild(d); d.style.opacity = 1; await wait(100);
    draw(ZE, 0, false);
    await wait(300);
    d.classList.add('ready');
    const lcx = dl + dw / 2, lcy = dtop + dh / 2;
    d.addEventListener('click', async () => {
      if (d.dataset.done) return; d.dataset.done = 1; d.classList.remove('ready');
      d.querySelector('#leaf').style.transform = 'rotateY(105deg)'; await wait(1000);
      sc.style.transformOrigin = `${lcx}px ${lcy}px`;
      sc.style.transition = 'transform 1.7s cubic-bezier(.65,0,.95,.5)';
      sc.style.transform = 'scale(60)'; await wait(1750);
      sc.style.background = '#000'; document.body.style.background = '#000';
      await wait(1000); present();
    });
  }

  // cadoul vine spre ecran, se deschide si apare mesajul
  async function present() {
    const G = document.createElement('div'); G.id = 'present';
    G.innerHTML = '<svg viewBox="0 0 100 80" width="170" height="136"><rect class="b" x="6" y="24" width="88" height="50" rx="3"/><rect class="w" x="14" y="44" width="22" height="16" rx="1"/><rect class="w" x="44" y="24" width="12" height="50"/><g id="plid"><rect class="b" x="2" y="12" width="96" height="16" rx="3"/><rect class="w" x="44" y="12" width="12" height="16"/></g></svg><span class="sp" style="--dx:-30px">✨</span><span class="sp" style="--dx:5px">✨</span><span class="sp" style="--dx:35px">✨</span>';
    const m = document.createElement('div'); m.id = 'msg'; 'E pentru tine draga mea🙃♥️'.split(' ').forEach((w, i, a) => {
      const sp = document.createElement('span'); sp.style.setProperty('--i', i); sp.textContent = w;
      m.appendChild(sp); if (i < a.length - 1) m.appendChild(document.createTextNode(' '));
    });
    document.body.append(G, m);
    G.getBoundingClientRect(); G.classList.add('in'); await wait(1900);
    G.classList.add('open'); await wait(700); m.classList.add('on');
  }

</script>
